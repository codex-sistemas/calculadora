<app-column style="
    width: 100%;
    height: 100%;
    background-color: var(--color-background);
    color: var(--color-text);
    gap: 0;
">

    <app-column style="
        flex: 1;
        width: 100%;
        box-sizing: border-box;
        padding: 2rem;
        gap: 1rem;
        justify-content: center;
        align-items: stretch;
    ">

        <h1 style="
            margin: 0;
            font-size: 2.5rem;
            color: var(--color-primary);
            text-align: center;
        ">
            Calculadora
        </h1>

        <input type="text" id="display" readonly value="0" style="
            width: 100%;
            box-sizing: border-box;
            padding: 1rem;
            border: 1px solid var(--color-secondary);
            border-radius: 0.5rem;
            background-color: var(--color-background);
            color: var(--color-text);
            font-size: 2rem;
            outline: none;
            text-align: right;
        ">

        <app-column style="
            width: 100%;
            flex: 1;
            gap: 0.5rem;
        ">

            <app-row style="width: 100%; flex: 1; gap: 0.5rem;">

                <button onclick="APP.actions.clear()" style="
                    flex: 1;
                    font-size: 1.2rem;
                    border: none;
                    border-radius: 0.5rem;
                    background-color: var(--color-secondary);
                    color: var(--color-background);
                ">C</button>

                <button onclick="APP.actions.backspace()" style="
                    flex: 1;
                    font-size: 1.2rem;
                    border: none;
                    border-radius: 0.5rem;
                    background-color: var(--color-secondary);
                    color: var(--color-background);
                ">⌫</button>

                <button onclick="APP.actions.operation('/')" style="
                    flex: 1;
                    font-size: 1.2rem;
                    border: none;
                    border-radius: 0.5rem;
                    background-color: var(--color-primary);
                    color: var(--color-background);
                ">÷</button>

            </app-row>

            <app-row style="width: 100%; flex: 1; gap: 0.5rem;">

                <button onclick="APP.actions.number('7')" style="flex: 1;">7</button>
                <button onclick="APP.actions.number('8')" style="flex: 1;">8</button>
                <button onclick="APP.actions.number('9')" style="flex: 1;">9</button>

                <button onclick="APP.actions.operation('*')" style="
                    flex: 1;
                    font-size: 1.2rem;
                    border: none;
                    border-radius: 0.5rem;
                    background-color: var(--color-primary);
                    color: var(--color-background);
                ">×</button>

            </app-row>

            <app-row style="width: 100%; flex: 1; gap: 0.5rem;">

                <button onclick="APP.actions.number('4')" style="flex: 1;">4</button>
                <button onclick="APP.actions.number('5')" style="flex: 1;">5</button>
                <button onclick="APP.actions.number('6')" style="flex: 1;">6</button>

                <button onclick="APP.actions.operation('-')" style="
                    flex: 1;
                    font-size: 1.2rem;
                    border: none;
                    border-radius: 0.5rem;
                    background-color: var(--color-primary);
                    color: var(--color-background);
                ">−</button>

            </app-row>

            <app-row style="width: 100%; flex: 1; gap: 0.5rem;">

                <button onclick="APP.actions.number('1')" style="flex: 1;">1</button>
                <button onclick="APP.actions.number('2')" style="flex: 1;">2</button>
                <button onclick="APP.actions.number('3')" style="flex: 1;">3</button>

                <button onclick="APP.actions.operation('+')" style="
                    flex: 1;
                    font-size: 1.2rem;
                    border: none;
                    border-radius: 0.5rem;
                    background-color: var(--color-primary);
                    color: var(--color-background);
                ">+</button>

            </app-row>

            <app-row style="width: 100%; flex: 1; gap: 0.5rem;">

                <button onclick="APP.actions.number('0')" style="flex: 2;">0</button>

                <button onclick="APP.actions.decimal()" style="flex: 1;">
                    .
                </button>

                <button onclick="APP.actions.calculate()" style="
                    flex: 1;
                    font-size: 1.2rem;
                    border: none;
                    border-radius: 0.5rem;
                    background-color: var(--color-primary);
                    color: var(--color-background);
                "> = </button>

            </app-row>

        </app-column>

    </app-column>

</app-column>
